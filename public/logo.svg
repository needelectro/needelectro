    <path d="M36 14L18 36H32L28 50L46 28H32L36 14Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  
  <!-- Text: NEED ELECTRO -->
